[project]
name = "volu-gen"
version = "0.1.0"
description = "volu_disp host backend: audio analysis, animation generation, playback"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy",
    "scipy",
    "soundfile",
    "soxr",
    "torch==2.11.0",
    "torchaudio==2.11.0",
    # Analysis models — see docs/decisions/0004-audio-analysis.md.
    "demucs==4.1.0",
    "beat-this==1.1.0",
    # SongFormer's remote code fails to load on transformers 5 (meta-device
    # init). MAEST and CLAP work on 4.51.1. Do not bump.
    "transformers==4.51.1",
    "huggingface_hub",
    # SongFormer's remote-code imports
    "muq==0.1.0",
    "x-transformers==2.4.14",
    "msaf==0.1.80",
    "ema-pytorch",
    "loguru",
    "omegaconf",
    "einops",
    "librosa",
    "zstandard>=0.25.0",
    "pyyaml>=6.0.3",
    # Drum onsets (docs/decisions/0016-drum-onsets-adtof.md). Models are
    # CC BY-NC-SA 4.0: non-commercial use only.
    "adtof-pytorch",
    # Method params and the plan (docs/generators.md).
    "pydantic>=2.14.3",
]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/volu_gen"]

[tool.uv]
# CUDA hosts only; demucs pins an old torch on macOS.
environments = [
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }
adtof-pytorch = { git = "https://github.com/xavriley/ADTOF-pytorch", rev = "85c192e78f716ea0b111cc8a5ee4a8f6a3a4f8a9" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
