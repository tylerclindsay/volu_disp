; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
; OTA password lives in secrets.ini (gitignored) - copy secrets.ini.example
extra_configs = secrets.ini

[env]
platform = espressif32
board = wt32-eth01
framework = arduino
monitor_speed = 115200
board_build.partitions = default.csv   ; two OTA slots
build_flags =
    -DCORE_DEBUG_LEVEL=1
    '-DOTA_PASSWORD="${secrets.ota_password}"'
; No LED library: src/edge_out.cpp drives I2S1 directly (decision 0014).
; Per-node strip layout: add e.g. -DNUM_STRIPS=40 -DLEDS_PER_STRIP=12 above.

[env:serial]
upload_protocol = esptool
upload_speed = 460800

[env:ota]
upload_protocol = espota
upload_port = volu-disp-node-1.local
upload_flags =
    --auth=${secrets.ota_password}