# Bench test setup: one drive node with 40 strips x 12 pixels (the
# firmware's default NUM_STRIPS / LEDS_PER_STRIP in
# firmware/drive_node/src/config.h), laid out as prototype.yaml's node 1.
# Use it to drive the bench from gen_system, e.g.
#   uv run python -m volu_gen.output ../../config/displays/bench.yaml --pattern nodes
# Units: mm. Indices are 0-based. Schema: see prototype.yaml.
version: 1

geometry:
  size: { x: 10, y: 12, z: 4 }  # 10 strips wide, 12 pixels tall, 4 slices deep
  strip_spacing: 50
  pixel_spacing: 50
  slice_spacing: 25
  odd_slice_offset:
    x: 25
    y: 25

timing:
  default_fps: 120

network:
  udp_port: 7777

# Strip s = z * 10 + x: strips 0-31 on edge node E1 (J1-J32), 32-39 on E2 (J1-J8).
drive_nodes:
  - id: 1
    ip: 192.168.1.101
    section: { x: [0, 9], y: [0, 11], z: [0, 3] }   # 40 strips
