# Prototype display config. Read by volu_gen.geometry / volu_gen.mapping
# (decision 0013); unknown keys are errors.
# Units: mm. Indices are 0-based.
#
# Axes:   x = across a slice (strip index within a slice)
#         y = vertical (pixel index along a strip)
#         z = depth (slice index)
version: 1

geometry:
  size: { x: 10, y: 12, z: 8 }  # 10 strips wide, 12 pixels tall, 8 slices deep
  strip_spacing: 50             # x pitch between strips within a slice
  pixel_spacing: 50             # y pitch between pixels along a strip
  slice_spacing: 25             # z pitch between slices
  # Every odd slice (z = 1, 3, ...) is shifted by these amounts:
  odd_slice_offset:
    x: 25                       # ½ strip_spacing
    y: 25                       # ½ pixel_spacing

timing:
  default_fps: 120              # display FPS until changed in the UI: whole number 30–480
                                # (decision 0010); animations render and play only at it

network:
  udp_port: 7777

# Each drive node owns one rectangular box of the display, given as
# inclusive index ranges [min, max] on each axis. Every (x, z) column inside
# a box is one strip on that node. Boxes must not overlap, must together
# cover the whole display, and each must contain ≤ 64 strips (x × z count).
#
# Strip numbering within a node: z-major, then x — strip = (z - z0) * width
# + (x - x0). Strips 0–31 are on edge node A, 32–63 on edge node B.
# (Planned default; physical wiring not final.)
# Pixel 0 of each strip is at the top (y = 0 is the top).
drive_nodes:
  - id: 1
    ip: 192.168.1.101           # 192.168.1.(100 + id)
    section: { x: [0, 9], y: [0, 11], z: [0, 3] }   # 40 strips
  - id: 2
    ip: 192.168.1.102
    section: { x: [0, 9], y: [0, 11], z: [4, 7] }   # 40 strips
